[package]
name = "tts"
version = "0.1.0"
edition = "2021"
description = "Thin CLI wrapper around the MiniMax t2a_v2 text-to-speech API."
readme = "README.md"

[[bin]]
name = "tts"
path = "src/main.rs"

[dependencies]
# rustls-based HTTP so the headless box needs no OpenSSL system library.
ureq = { version = "2.12", default-features = false, features = ["tls"] }
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
# Scoped temp files/dirs for the local-engine WAV handoff, auto-cleaned on drop.
tempfile = "3"
